# The Compose project owns the persistent deployment volumes and network.
name: wingsbalance
services:
  web:
    build: {context: ., dockerfile: Dockerfile.web}
    restart: unless-stopped
    environment: {API_INTERNAL_URL: http://api:4000}
    depends_on: {api: {condition: service_healthy}}
    healthcheck: {test: ["CMD","wget","-qO-","http://127.0.0.1:3000/"], interval: 15s, timeout: 5s, retries: 5, start_period: 30s}
  api:
    build: {context: ./apps/api, target: api}
    restart: unless-stopped
    env_file: .env
    healthcheck: {test: ["CMD","wget","-qO-","http://127.0.0.1:4000/health"], interval: 15s, timeout: 3s, retries: 5, start_period: 30s}
    depends_on: {migrate: {condition: service_completed_successfully}, redis: {condition: service_healthy}}
  migrate:
    build: {context: ./apps/api, target: migration}
    restart: "no"
    env_file: .env
    command: ["sh","-c","npm run prisma:migrate && npm run seed"]
    depends_on: {postgres: {condition: service_healthy}}
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment: {POSTGRES_DB: wingsbalance, POSTGRES_USER: wingsbalance, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"}
    ports: ["127.0.0.1:55432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL","pg_isready -U wingsbalance"], interval: 10s, timeout: 5s, retries: 5}
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports: ["127.0.0.1:6379:6379"]
    volumes: [redis_data:/data]
    healthcheck: {test: ["CMD","redis-cli","ping"], interval: 10s, timeout: 3s, retries: 5}
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address :9001
    environment: {MINIO_ROOT_USER: "${MINIO_ROOT_USER}", MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"}
    volumes: [minio_data:/data]
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["80:80"]
    volumes: ["./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro","./infra/tls:/etc/nginx/tls:ro"]
    depends_on: {web: {condition: service_healthy}, api: {condition: service_healthy}}
volumes: {postgres_data: {}, redis_data: {}, minio_data: {}}
