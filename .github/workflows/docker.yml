name: Docker images
on:
  workflow_dispatch:
  push:
    paths:
      - "Dockerfile.web"
      - "docker-compose.yml"
      - ".dockerignore"
      - "apps/api/Dockerfile"
      - "apps/api/.dockerignore"
      - "apps/api/**"
      - "app/**"
      - "package.json"
      - "package-lock.json"
      - "infra/**"
      - ".env.example"
permissions:
  contents: read
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose build web api migrate
