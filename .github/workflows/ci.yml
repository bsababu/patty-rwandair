name: CI and deployment checks

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      operation:
        description: "Production operation"
        type: choice
        options: [migrate, reset-admin]
        default: migrate
        required: true
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm --prefix apps/api ci
      - run: npm --prefix apps/api run prisma:generate
      - run: npm --prefix apps/api run build
      - run: npm run build
      - run: npm run lint
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: {run: {working-directory: apps/api}}
    env:
      DATABASE_URL: postgresql://wingsbalance:ci-only@127.0.0.1:5432/wingsbalance
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: wingsbalance
          POSTGRES_USER: wingsbalance
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U wingsbalance -d wingsbalance"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npm run prisma:generate
      - run: npx prisma validate
      - run: npm run prisma:migrate
      - run: npm test
      - run: npm run build

  migrate:
    name: Apply production Prisma migrations
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.operation == 'migrate') || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    needs: [web, api]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Production
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - name: Validate production database secret
        env:
          DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL || secrets.DATABASE_URL }}
        run: |
          test -n "$DATABASE_URL"
          case "$DATABASE_URL" in
            postgres://*|postgresql://*) ;;
            *) echo "DATABASE_URL must be a PostgreSQL connection URL."; exit 1 ;;
          esac
          case "$DATABASE_URL" in
            *localhost*|*127.0.0.1*|*@host:*|*user:password*|*/database*)
              echo "DATABASE_URL still contains an example placeholder.";
              exit 1
              ;;
          esac
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run prisma:migrate
        env:
          DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL || secrets.DATABASE_URL }}

  reset-admin:
    name: Reset Production admin account
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'reset-admin' }}
    needs: [web, api]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Production
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - name: Validate reset credentials
        env:
          DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL || secrets.DATABASE_URL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          test -n "$DATABASE_URL"
          test -n "$ADMIN_PASSWORD"
          test "${#ADMIN_PASSWORD}" -ge 10
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run admin:reset
        env:
          DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL || secrets.DATABASE_URL }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL || 'admin@wings.rw' }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
