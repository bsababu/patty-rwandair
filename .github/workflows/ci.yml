name: CI
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm run build
      - run: npm run lint
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: {run: {working-directory: apps/api}}
    env:
      DATABASE_URL: postgresql://wingsbalance:ci-only@127.0.0.1:5432/wingsbalance
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: wingsbalance
          POSTGRES_USER: wingsbalance
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U wingsbalance -d wingsbalance"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npm run prisma:generate
      - run: npx prisma validate
      - run: npm run prisma:migrate
      - run: npm test
      - run: npm run build
