name: Production database migration

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-database-migration
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply Prisma migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Production
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - name: Require production database secret
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          test -n "$DATABASE_URL"
          case "$DATABASE_URL" in
            postgres://*|postgresql://*) ;;
            *) echo "The production database secret must be a PostgreSQL connection URL."; exit 1 ;;
          esac
          case "$DATABASE_URL" in
            *localhost*|*127.0.0.1*) echo "Production DATABASE_URL cannot point to localhost."; exit 1 ;;
          esac
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run prisma:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
